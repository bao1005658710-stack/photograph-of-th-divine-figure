<!doctype html>
<html lang="zh-CN" data-type="service">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090a">
<meta name="description" content="夜幕档案，一间由你整理的本地人像照片档案。">
<meta property="og:title" content="夜幕档案 · Nocturne">
<meta property="og:description" content="一间由你整理的本地人像照片档案。">
<meta property="og:image" content="https://bao1005658710-stack.github.io/photograph-of-th-divine-figure/photos/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20261114145747_56_2.jpg">
<link rel="canonical" href="https://bao1005658710-stack.github.io/photograph-of-th-divine-figure/">
<meta name="page-type" content="service">
<meta name="site-kind" content="other">
<title>夜幕档案 · Nocturne</title>
<link rel="stylesheet" href="style.css">
<script src="portrait-library.js" defer></script>
<script src="gallery.js" defer></script>
</head>
<body id="top">
<a class="skip" href="#gallery">跳到照片</a>
<header class="mast">
  <a class="brand" href="#top"><span class="mark" aria-hidden="true"></span><span>NOCTURNE</span></a>
  <nav aria-label="主导航"><a href="#gallery">人像</a><a href="#albums">相册</a></nav>
  <button class="motion-switch" type="button" aria-pressed="false" title="暂停背景动效"><span aria-hidden="true"></span><b>动态</b></button>
</header>
<main>
  <section class="hero" aria-labelledby="hero-title" data-enter>
    <div class="hero-frame">
      <img class="cover" src="photos/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20261114145747_56_2.jpg" alt="" fetchpriority="high">
      <div class="hero-shade"></div>
      <canvas id="dust" aria-hidden="true"></canvas>
      <div class="hero-copy">
        <p class="eyebrow"><span></span> NOCTURNE / 人像档案</p>
        <h1 id="hero-title"><span>每一帧，</span><span>都是你。</span></h1>
        <p class="hero-note">一间留给你的私人影集。<br>收好那些值得再看一眼的瞬间。</p>
        <button class="enter upload-trigger" type="button">上传人像 <span aria-hidden="true">＋</span></button>
      </div>
      <span class="frame-corner" aria-hidden="true"></span>
    </div>
    <div class="hero-bottom"><span>THE PORTRAIT ARCHIVE</span><a href="#gallery">浏览人像 <span aria-hidden="true">↓</span></a></div>
  </section>

  <section class="manifesto wrap" id="moments" aria-labelledby="manifesto-title">
    <div class="manifesto-copy">
      <p class="eyebrow"><span></span> 日常存档</p>
      <h2 id="manifesto-title"><span>神人时刻。</span><span>泡面日常。</span></h2>
      <p>热气还在，快门刚好落下。</p>
    </div>
  </section>

  <section class="gallery wrap" id="gallery" aria-labelledby="gallery-title">
    <div class="section-head">
      <div><p class="eyebrow"><span></span> YOUR PORTRAITS</p><h2 id="gallery-title">你的人像</h2></div>
      <span id="total" class="section-count" aria-live="polite"></span>
    </div>
    <div class="gallery-tools"><p id="library-message" role="status">正在读取本地相册…</p><button class="compact upload-trigger" type="button">上传照片 <span aria-hidden="true">＋</span></button></div>
    <div id="empty-library" class="empty-library" hidden><h3>从第一张开始。</h3><p>可一次选择多张照片，也可以把照片拖到这里。</p><button class="enter upload-trigger" type="button">选择照片 <span aria-hidden="true">＋</span></button></div>
    <div class="filters" id="filters" aria-label="筛选相册" role="group"></div>
    <div class="grid" id="photo-grid"></div>
    <div class="gallery-end" id="load-point"><button id="load-more" type="button">加载更多</button><p id="end-note" hidden>已浏览完此相册</p></div>
  </section>

  <section class="albums wrap" id="albums" aria-labelledby="albums-title">
    <div class="section-head"><div><p class="eyebrow"><span></span> ALBUMS</p><h2 id="albums-title">分类相册</h2></div></div>
    <div class="album-grid" id="album-grid"></div><p class="no-album" id="no-album">上传时填写相册名称，就能在这里找到它。</p>
  </section>
</main>
<footer class="footer wrap"><a class="brand" href="#top"><span class="mark" aria-hidden="true"></span><span>NOCTURNE</span></a><a class="back" href="#top">返回顶部 <span aria-hidden="true">↑</span></a></footer>

<dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-head"><span id="viewer-index"></span><button id="close-viewer" class="icon-button" type="button" aria-label="关闭照片">×</button></div>
  <div class="viewer-stage">
    <button id="prev-photo" class="icon-button" type="button" aria-label="上一张">‹</button>
    <img id="viewer-image" alt="">
    <button id="next-photo" class="icon-button" type="button" aria-label="下一张">›</button>
  </div>
  <div class="viewer-foot" aria-live="polite"><h2 id="viewer-title"></h2><div class="viewer-actions"><p id="viewer-album"></p><span id="viewer-error" role="status"></span><button id="delete-photo" class="compact" type="button">移除照片</button></div></div>
</dialog>
<dialog id="upload" class="upload-modal" aria-labelledby="upload-title">
  <form id="upload-form">
    <div class="upload-heading"><h2 id="upload-title">上传人像</h2><button id="close-upload" class="icon-button" type="button" aria-label="关闭上传窗口">×</button></div>
    <label class="field">照片
      <input id="photo-files" type="file" accept="image/*" multiple>
    </label>
    <p id="selection" class="upload-hint">可选择多张图片。导入的照片只保存在当前浏览器。</p>
    <label class="field">相册名称
      <input id="album-input" type="text" value="人像" list="album-options" maxlength="40" required>
      <datalist id="album-options"></datalist>
    </label>
    <p id="upload-status" class="upload-hint" role="status"></p>
    <button id="save-photos" class="enter" type="submit">保存到相册 <span aria-hidden="true">＋</span></button>
  </form>
</dialog>
</body>
</html>
